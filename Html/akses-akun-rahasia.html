<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pengaturan Akun Pusat | Nusa Karsa Event</title>
  <link rel="stylesheet" href="../Css/change-password.css">
</head>
<body>
  <main class="password-card">
    <a class="back-link" href="../halaman.html">← Kembali ke dashboard</a>
    <p class="eyebrow">Area pengelola pusat</p>
    <h1>Ganti password</h1>
    <p class="intro">Password admin pusat disimpan di pengaturan terpisah. Gunakan password baru yang unik dan sedikitnya 12 karakter.</p>
    <form id="changePasswordForm" novalidate>
      <label for="currentPassword">Password saat ini</label>
      <input id="currentPassword" name="current_password" type="password" autocomplete="current-password" required>
      <label for="newPassword">Password baru</label>
      <input id="newPassword" name="new_password" type="password" autocomplete="new-password" minlength="12" required>
      <label for="confirmPassword">Ulangi password baru</label>
      <input id="confirmPassword" name="confirm_password" type="password" autocomplete="new-password" minlength="12" required>
      <button type="submit">Simpan password baru</button>
      <p id="formMessage" class="form-message" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script src="../Js/change-password.js"></script>
</body>
</html>
